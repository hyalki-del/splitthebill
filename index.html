<!DOCTYPE html>
<html lang="en" data-theme="silk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPENSE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-main: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --border-color: #cbd5e1;
            --font-body: 'Inter', sans-serif; --card-radius: 1.5rem;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-body); }
        .theme-card { background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--card-radius); }
        .theme-input { background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 0.85rem; outline: none; }
        .theme-btn { border: 2px solid var(--border-color); border-radius: 0.85rem; font-weight: 800; }
        .theme-btn:active { transform: translateY(1px); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 antialiased">

    <!-- App Main Container -->
    <div id="appContainer" class="max-w-4xl mx-auto space-y-6">
        <header class="theme-card p-6 flex justify-between items-center">
            <h1 class="text-2xl font-black">SPENSE</h1>
            <div id="viewModeIndicator" class="text-sm font-bold text-slate-500">AWAITING AUTHENTICATION...</div>
            <button id="settingsBtn" type="button" class="hidden theme-btn px-3 py-1 text-xs">⚙ Settings</button>
        </header>
    </div>

    <!-- Welcome / Landing Modal -->
    <div id="welcomeModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="theme-card p-6 sm:p-8 max-w-md w-full space-y-6 bg-white text-slate-900 relative">
            
            <div class="text-center space-y-2 border-b pb-4">
                <h2 class="text-3xl font-black tracking-tight">SPENSE</h2>
                <p class="text-xs text-slate-500 font-semibold">Confidential Group Expense Tracker</p>
            </div>

            <!-- Tab Switcher Header -->
            <div class="flex gap-2 p-1 bg-slate-100 rounded-2xl">
                <button id="btnTabCreate" type="button" class="flex-1 theme-btn py-2 text-xs font-black uppercase tracking-wider bg-amber-300 text-slate-900 rounded-xl cursor-pointer">Create New</button>
                <button id="btnTabRecall" type="button" class="flex-1 theme-btn py-2 text-xs font-black uppercase tracking-wider bg-transparent text-slate-500 rounded-xl cursor-pointer">Recall Existing</button>
            </div>

            <!-- Create Section -->
            <div id="createSection" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-extrabold text-slate-800">Ledger Name</label>
                    <input type="text" id="newLedgerName" placeholder="e.g. dinner-club" class="w-full theme-input px-3 py-2 text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-extrabold text-slate-800">Set 4-Digit PIN</label>
                    <input type="text" id="newLedgerPin" maxlength="4" placeholder="1234" class="w-full theme-input px-3 py-2 text-sm font-mono tracking-widest">
                </div>
                <button id="btnInitializeLedger" type="button" class="w-full theme-btn bg-lime-400 hover:bg-lime-500 text-slate-900 py-3 text-xs font-black uppercase tracking-wider rounded-xl cursor-pointer">Initialize Ledger</button>
            </div>

            <!-- Recall Section -->
            <div id="recallSection" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-xs font-extrabold text-slate-800">Select Archive</label>
                    <select id="archiveSelect" class="w-full theme-input px-3 py-2 text-sm cursor-pointer">
                        <option value="">-- Loading Archives... --</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-extrabold text-slate-800">Enter 4-Digit PIN</label>
                    <input type="text" id="recallLedgerPin" maxlength="4" placeholder="1234" class="w-full theme-input px-3 py-2 text-sm font-mono tracking-widest">
                </div>
                <button id="btnAccessLedger" type="button" class="w-full theme-btn bg-cyan-400 hover:bg-cyan-500 text-slate-900 py-3 text-xs font-black uppercase tracking-wider rounded-xl cursor-pointer">Access Ledger</button>
            </div>

        </div>
    </div>

    <!-- Ensure correct relative path to JS file -->
    <script src="js/app.js"></script>
</body>
</html>
